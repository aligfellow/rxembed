[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxembed"
version = "0.1.0"
description = "Fast, flexible molecular embedding for reactive chemistry."
authors = [{name = "Alister S. Goodfellow"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "rdkit",
    "prism_pruner", 
    "openconf",
    "xyzgraph",
    "scikit-learn",
    "networkx",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
ase = ["ase"]
viz = ["matplotlib", "seaborn", "xyzrender"]
all = ["ase", "matplotlib", "seaborn", "xyzrender"]

[project.urls]
homepage = "https://github.com/aligfellow/rxembed"

# openconf's transition-metal support (the `transition_metal` preset + auto metal-move budget) is on the
# upstream main branch but not yet on a PyPI release, so pull it from git. `uv sync` resolves this for
# everyone (CI included) and pins the exact commit in uv.lock. To co-develop openconf, clone it as a sibling
# and override with an editable install: `uv pip install -e ../openconf` (see the README dev section).
[tool.uv.sources]
openconf = { git = "https://github.com/rowansci/openconf" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.14",
    "ty>=0.0.14",
    "ipykernel", 
    "seaborn",
    "matplotlib",
    "ase",
    "xyzrender", 
]

# ===== Ruff =====
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
exclude = ["examples/*.ipynb", "playground/*ipynb"]
select = [
    "B",      # bugbear
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming conventions
    "W",      # pycodestyle warnings
    "C4",     # comprehensions
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PIE",    # misc lints
    "PYI",    # flake8-pyi
    "TID",    # tidy imports
    "TCH",    # type-checking imports
    "RUF",    # Ruff-specific rules
    "RSE",    # flake8-raise
    "ICN001", # unconventional-import-alias
]
ignore = [
    "PLR0911", # Too many returns
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0914", # Too many locals
    "PLR0915", # Too many statements
    "PLR1702", # Too many nested-blocks
    "PLC0415", # Local imports which may be performance related
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["D", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

# ===== ty =====
[tool.ty]

[tool.ty.src]
exclude = ["examples", "playground", ".venv"]

# ===== Pytest =====
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE"

# ===== Coverage =====
[tool.coverage.run]
source = ["src/rxembed"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
