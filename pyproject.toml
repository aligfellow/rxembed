[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxembed"
version = "0.1.0"
description = "Constrained conformer embedding for reactive chemistry."
authors = [{name = "Alister S. Goodfellow"}]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy", "rdkit", "networkx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
search = ["openconf @ git+https://github.com/rowansci/openconf@1fa1441096dc2d4ff662894750644b62c82a20ba"]
workflow = ["xyzgraph>=1.6.14", "prism_pruner", "scikit-learn", "matplotlib"]

[project.urls]
homepage = "https://github.com/aligfellow/rxembed"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "rxembed[search,workflow]",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.14",
    "ty>=0.0.14",
    "ipykernel",
    "xyzrender>=0.3.8",
]

# ===== Ruff =====
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
exclude = ["examples/*.ipynb"]
select = [
    "B",      # bugbear
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming conventions
    "W",      # pycodestyle warnings
    "C4",     # comprehensions
    "C901",   # mccabe cyclomatic complexity ceiling (see [tool.ruff.lint.mccabe])
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PIE",    # misc lints
    "PYI",    # flake8-pyi
    "TID",    # tidy imports
    "TCH",    # type-checking imports
    "RUF",    # Ruff-specific rules
    "RSE",    # flake8-raise
    "ICN001", # unconventional-import-alias
]
ignore = [
    "PLR0911", # Too many returns
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0914", # Too many locals
    "PLR0915", # Too many statements
    "PLR1702", # Too many nested-blocks
    "PLC0415", # Local imports which may be performance related
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["D", "PLR2004"]
"src/rxembed/pipeline/xyz2mol_local.py" = ["ALL"]
"src/rxembed/pipeline/xyz2mol_tmc.py" = [
    "N802", "N806", "PLR2004", "RUF046", "RUF059", "RUF015",
    "D205", "D401", "D406", "D407", "C401", "C901", "B905", "PLW0603", "PLW0604",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
exclude = [
    "src/rxembed/pipeline/xyz2mol_local.py",
    "src/rxembed/pipeline/xyz2mol_tmc.py"
]

# ===== ty =====
[tool.ty]

[tool.ty.src]
exclude = ["examples", ".venv"]

# ===== Pytest =====
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE"

# ===== Coverage =====
[tool.coverage.run]
source = ["src/rxembed"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
